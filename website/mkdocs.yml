# Course website. Build locally:
#   pip install -r website/requirements.txt
#   python3 website/build.py && mkdocs serve -f website/mkdocs.yml
site_name: "Machine Learning: First Principles to Production"
site_description: Core ML algorithms from first principles, real-world ML systems, and ML system design interview preparation.
site_url: https://maiphong0411.github.io/machine-learning-worldclass/
repo_url: https://github.com/maiphong0411/machine-learning-worldclass
repo_name: machine-learning-worldclass
edit_uri: ""

docs_dir: _src
site_dir: _site

theme:
  name: material
  custom_dir: overrides
  features:
    # One tab per course part, so the sidebar only lists the current part's pages.
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible heading ids, so in-page links work on both GitHub and the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - pymdownx.details
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  # Optional cookieless analytics: create a free site at https://www.goatcounter.com and put
  # its code here (e.g. "ml-worldclass"). Leave empty to disable. See docs/tracking-and-analytics.md.
  goatcounter: ""

extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - assets/js/progress.js
  - assets/js/lab-runner.js
  - assets/js/exam.js

