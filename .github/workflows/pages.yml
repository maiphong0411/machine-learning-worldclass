name: Deploy course website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Safety net: while Settings -> Pages -> Source is "Deploy from a branch", GitHub also runs
  # its own Jekyll build on every push. If it finishes after this workflow, it replaces the
  # MkDocs site with plain pages. Redeploying when that build completes means MkDocs always
  # publishes last. (This workflow's own deploys do not trigger GitHub's build, so no loop.)
  workflow_run:
    workflows: ["pages build and deployment", "pages-build-deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r website/requirements.txt
      - name: "Assemble and build the site (strict mode fails on broken links)"
        run: |
          python3 website/build.py
          mkdocs build -f website/mkdocs.yml --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
